<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stuttgart Sept</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0F2733; --teal-2:#1B5C6B; --coral:#E8623F; --coral-dim:#C94F30;
    --gold:#D9A441; --cream:#F4EFE3; --paper:#FBF8F1; --line:rgba(15,39,51,0.12);
    --go:#3E8E5B; --no:#B24638;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--ink);
    background-image:radial-gradient(circle at 15% 0%, rgba(27,92,107,0.55), transparent 45%);
    font-family:'Work Sans', sans-serif; color:var(--cream);
    min-height:100vh; padding-bottom:40px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px; margin:0 auto; padding:16px 12px 8px;}

  header{padding:4px 4px 14px; display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:24px; margin:0; color:var(--paper);}
  h1 em{font-style:italic; color:var(--coral);}
  .count{font-size:12px; color:rgba(244,239,227,0.55);}

  /* Crew */
  .crew{
    background:var(--paper); color:var(--ink); border-radius:14px;
    padding:12px 12px 14px; box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }
  .crew-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .crew-chip{
    display:flex; align-items:center; gap:4px; background:var(--cream);
    border:1px solid var(--line); border-radius:999px; padding:4px 4px 4px 10px; font-size:13px; font-weight:600;
  }
  .crew-chip input{border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); width:64px; outline:none;}
  .crew-chip button{border:none; background:var(--coral); color:#fff; width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1;}
  .add-person{border:1.5px dashed var(--teal-2); background:transparent; color:var(--teal-2); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; margin-top:8px;}
  .lock-badge{
    display:inline-block; font-size:11px; margin-top:8px; padding:4px 10px; border-radius:999px;
    background:rgba(217,164,65,0.18); color:#a97a0f; border:1px solid rgba(217,164,65,0.4);
  }
  .lock-badge.unlocked{background:rgba(62,142,91,0.15); color:var(--go); border-color:rgba(62,142,91,0.35);}

  /* Summary table */
  .table-card{margin-top:14px; background:var(--paper); color:var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  thead th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:#6b7a7f; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .ev-name{font-weight:700; font-size:12.5px;}
  .ev-link{color:var(--teal-2); font-size:11px; text-decoration:none;}
  .going-count{font-weight:700; color:var(--coral-dim); white-space:nowrap;}

  /* Event cards */
  .events{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .event{background:var(--paper); color:var(--ink); border-radius:14px; padding:14px 14px 12px; box-shadow:0 6px 20px rgba(0,0,0,0.25); border-left:4px solid var(--coral);}
  .event.flag{border-left-color:var(--gold);}
  .ev-title{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 6px; line-height:1.15;}
  .meta{font-size:13px; line-height:1.6;}
  .meta a{color:var(--teal-2); text-decoration:none; font-weight:600;}
  .flag-note{margin-top:8px; font-size:11.5px; background:rgba(217,164,65,0.18); border:1px solid rgba(217,164,65,0.5); padding:6px 9px; border-radius:8px; color:#6b4d10;}

  .rsvp-row{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
  .rsvp-btn{
    display:flex; align-items:center; gap:5px; border:none; border-radius:999px;
    padding:6px 10px; font-size:12px; font-weight:600; background:#e6e0d2; color:#5b6b70; cursor:pointer;
  }
  .rsvp-btn .sym{width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; background:#c9c2b0; color:#fff;}
  .rsvp-btn.yes .sym{background:var(--go);}
  .rsvp-btn.maybe .sym{background:var(--gold);}
  .rsvp-btn.no .sym{background:var(--no);}

  .notes-field{margin-top:10px;}
  .notes-field textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-family:inherit; font-size:12.5px; resize:vertical; min-height:32px; background:var(--cream); color:var(--ink);}
  .notes-field textarea::placeholder{color:#9aa7ab;}

  .save-state{position:fixed; bottom:10px; right:10px; font-size:10px; color:rgba(244,239,227,0.55); background:rgba(0,0,0,0.35); padding:4px 9px; border-radius:999px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(15,39,51,0.75); display:none; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--paper); color:var(--ink); border-radius:16px 16px 0 0; padding:20px; max-width:480px; width:100%;}
  .modal-box h3{font-family:'Fraunces',serif; margin:0 0 10px; font-size:16px;}
  .modal-box input{width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:16px; background:var(--cream); color:var(--ink);}
  .modal-actions{display:flex; gap:8px; margin-top:12px;}
  .modal-actions button{flex:1; border:none; padding:12px; border-radius:8px; font-weight:600; font-size:14px;}
  .modal-actions .cancel{background:#e6e0d2; color:var(--ink);}
  .modal-actions .confirm{background:var(--coral); color:#fff;}
  .modal-error{color:var(--no); font-size:12px; margin-top:6px; display:none;}

  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal-box{border-radius:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stuttgart <em>Sept</em></h1>
    <span class="count">5 events</span>
  </header>

  <div class="crew">
    <div class="crew-grid" id="crewGrid"></div>
    <button class="add-person" id="addPerson">+ Add</button>
    <div><span class="lock-badge" id="lockBadge"></span></div>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Event</th><th>Dates</th><th>Transit</th><th>Going</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <div class="events" id="eventsWrap"></div>
</div>
<div class="save-state" id="saveState">·</div>

<div class="modal-overlay" id="passModal">
  <div class="modal-box">
    <h3 id="modalTitle">Enter code</h3>
    <input type="password" id="passInput" placeholder="Passcode" autocomplete="off" inputmode="text">
    <div class="modal-error" id="passError">Wrong code</div>
    <div class="modal-actions">
      <button class="cancel" id="passCancel">Cancel</button>
      <button class="confirm" id="passConfirm">Unlock</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
function mapsLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }

const EVENTS = [
  {
    id:'stuttgart-am-meer', name:'Stuttgart am Meer',
    dates:'Thu 3.9, 10:00–22:00',
    address:'Konrad-Adenauer-Str. 2, 70173 Stuttgart',
    transit:'U-Bahn Charlottenplatz (U1/U2/U4/U5/U6/U7/U9/U12/U14/U15) · 2 min walk',
    price:'Free', flag:null
  },
  {
    id:'eat-spain-drink-spain', name:'Eat Spain Drink Spain',
    dates:'5.9 – 20.9 (all month)',
    address:'Various venues, Stuttgart',
    transit:'Varies by venue — check each listing',
    price:'Pay as you go', flag:null
  },
  {
    id:'lubu-moves', name:'LuBu MoVes (dance)',
    dates:'Wed 9.9, 19:00–20:00',
    address:'Arsenalplatz, 71638 Ludwigsburg',
    transit:'Bus stop "Ludwigsburg Arsenalplatz" (422/425/426/431/444) · right there. Ludwigsburg Bahnhof (S4/S5) · 6 min walk',
    price:'Free', flag:'This one is in Ludwigsburg, not Stuttgart — about 25 min by S-Bahn from the city centre.'
  },
  {
    id:'fantasy-filmfest', name:'40. Fantasy Filmfest',
    dates:'9.9 18:00 – 16.9 23:45',
    address:'Königstraße 20, 70173 Stuttgart (Gloria 2)',
    transit:'U-Bahn Schlossplatz · 1 min walk',
    price:'€12–14', flag:null
  },
  {
    id:'street-food-festival', name:'Street Food Festival – Feuersee',
    dates:'App: 18.9–20.9 · Poster: 25–27.9',
    address:'Feuerseeplatz, 70176 Stuttgart',
    transit:'U-Bahn/S-Bahn Feuersee · 3 min walk',
    price:'Free', flag:'Date conflict: the flyer and the saved listing disagree — confirm before you plan around it.'
  }
];

const DEFAULT_NAMES = ['Vasu','William','Raf','Mira','Hamza'];

// ---- SETUP before publishing ----
// One code per crew member, same order as DEFAULT_NAMES.
const PERSON_CODES = ["14112000","152486","652389","456825","584625"];
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// ----------------------------------

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDocRef = db.collection('plannerApp').doc('state');

let state = { crew: DEFAULT_NAMES.slice(), rsvp:{}, notes:{} };
let unlockedIndices = new Set(JSON.parse(sessionStorage.getItem('unlocked_indices') || '[]'));
let suppressNextSnapshot = false;
const STATUS_ORDER = ['none','yes','maybe','no'];
const STATUS_SYM = { none:'–', yes:'✓', maybe:'?', no:'✕' };

function saveUnlocked(){ sessionStorage.setItem('unlocked_indices', JSON.stringify([...unlockedIndices])); }
function saveIndicator(t){ document.getElementById('saveState').textContent = t; }

function normalizeState(){
  EVENTS.forEach(ev=>{
    const existing = state.rsvp[ev.id] || [];
    if(existing.length !== state.crew.length){
      state.rsvp[ev.id] = state.crew.map((_,i)=> existing[i] || 'none');
    }
    if(state.notes[ev.id] === undefined) state.notes[ev.id] = '';
  });
}

async function loadState(){
  saveIndicator('connecting…');
  try{
    const snap = await stateDocRef.get();
    if(snap.exists){
      const d = snap.data();
      state.crew = (d.crew && d.crew.length) ? d.crew : DEFAULT_NAMES.slice();
      state.rsvp = d.rsvp || {};
      state.notes = d.notes || {};
    }
  }catch(e){ saveIndicator('offline'); }
  normalizeState();
  stateDocRef.onSnapshot(snap=>{
    if(suppressNextSnapshot){ suppressNextSnapshot=false; return; }
    if(!snap.exists) return;
    const d = snap.data();
    state.crew = (d.crew && d.crew.length) ? d.crew : state.crew;
    state.rsvp = d.rsvp || state.rsvp;
    state.notes = d.notes || state.notes;
    normalizeState();
    renderAll();
  });
}

async function persist(){
  saveIndicator('saving…');
  suppressNextSnapshot = true;
  try{
    await stateDocRef.set({ crew:state.crew, rsvp:state.rsvp, notes:state.notes });
    saveIndicator('saved');
  }catch(e){ saveIndicator('failed'); }
}

function updateLockBadge(){
  const b = document.getElementById('lockBadge');
  if(unlockedIndices.size === 0){
    b.textContent = '🔒 tap a name to unlock';
    b.classList.remove('unlocked');
  }else{
    b.textContent = '🔓 ' + [...unlockedIndices].map(i=> state.crew[i]||`P${i+1}`).join(', ');
    b.classList.add('unlocked');
  }
}

function requireCode({ expectIndex=null, title, onSuccess }){
  const already = expectIndex !== null && unlockedIndices.has(expectIndex);
  const generallyOk = expectIndex === null && unlockedIndices.size > 0;
  if(already || generallyOk){ onSuccess(); return; }

  const modal = document.getElementById('passModal');
  const input = document.getElementById('passInput');
  const error = document.getElementById('passError');
  document.getElementById('modalTitle').textContent = title || 'Enter code';
  input.value = ''; error.style.display='none';
  modal.classList.add('show'); input.focus();

  const cleanup = ()=>{ modal.classList.remove('show'); confirmBtn.removeEventListener('click',onConfirm); cancelBtn.removeEventListener('click',onCancel); };
  const onConfirm = ()=>{
    const val = input.value.trim();
    let idx = -1;
    if(expectIndex !== null){ if(val === PERSON_CODES[expectIndex]) idx = expectIndex; }
    else{ idx = PERSON_CODES.indexOf(val); }
    if(idx !== -1){
      unlockedIndices.add(idx); saveUnlocked(); updateLockBadge(); cleanup(); onSuccess();
    }else{ error.style.display='block'; }
  };
  const onCancel = ()=> cleanup();
  const confirmBtn = document.getElementById('passConfirm');
  const cancelBtn = document.getElementById('passCancel');
  confirmBtn.addEventListener('click', onConfirm);
  cancelBtn.addEventListener('click', onCancel);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') onConfirm(); }, {once:true});
}

function renderCrew(){
  const grid = document.getElementById('crewGrid');
  grid.innerHTML = '';
  state.crew.forEach((name, idx)=>{
    const chip = document.createElement('div');
    chip.className = 'crew-chip';
    const input = document.createElement('input');
    input.value = name;
    input.addEventListener('focus', e=>{
      if(unlockedIndices.size===0){ e.target.blur(); requireCode({ title:'Enter your code to edit names', onSuccess:()=>input.focus() }); }
    });
    input.addEventListener('change', ()=>{
      requireCode({ title:'Enter your code', onSuccess:()=>{
        state.crew[idx] = input.value.trim() || `Person ${idx+1}`;
        persist(); renderSummary(); renderEvents();
      }});
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.addEventListener('click', ()=>{
      requireCode({ title:'Enter your code', onSuccess:()=>{
        if(state.crew.length<=1) return;
        state.crew.splice(idx,1);
        EVENTS.forEach(ev=> state.rsvp[ev.id].splice(idx,1));
        persist(); renderAll();
      }});
    });
    chip.appendChild(input); chip.appendChild(del);
    grid.appendChild(chip);
  });
}

function renderSummary(){
  const body = document.getElementById('summaryBody');
  body.innerHTML = '';
  EVENTS.forEach(ev=>{
    const going = state.rsvp[ev.id].filter(s=>s==='yes').length;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="ev-name">${ev.name}</div><a class="ev-link" href="${mapsLink(ev.address)}" target="_blank" rel="noopener">📍 map</a></td>
      <td>${ev.dates}</td>
      <td>${ev.transit.split('·')[0]}</td>
      <td class="going-count">${going}/${state.crew.length}</td>
    `;
    body.appendChild(tr);
  });
}

function renderEvents(){
  const wrap = document.getElementById('eventsWrap');
  wrap.innerHTML = '';
  EVENTS.forEach(ev=>{
    const card = document.createElement('div');
    card.className = 'event' + (ev.flag ? ' flag' : '');
    card.innerHTML = `
      <h3 class="ev-title">${ev.name}</h3>
      <div class="meta">
        🗓 ${ev.dates}<br>
        📍 <a href="${mapsLink(ev.address)}" target="_blank" rel="noopener">${ev.address}</a><br>
        🚉 ${ev.transit}<br>
        € ${ev.price}
      </div>
      ${ev.flag ? `<div class="flag-note">⚠ ${ev.flag}</div>` : ''}
      <div class="rsvp-row" data-ev="${ev.id}"></div>
      <div class="notes-field"><textarea data-notes-ev="${ev.id}" placeholder="Notes…">${state.notes[ev.id]}</textarea></div>
    `;
    wrap.appendChild(card);

    const row = card.querySelector('.rsvp-row');
    state.crew.forEach((name, idx)=>{
      const status = state.rsvp[ev.id][idx];
      const btn = document.createElement('button');
      btn.className = 'rsvp-btn ' + status;
      btn.innerHTML = `<span class="sym">${STATUS_SYM[status]}</span>${name}`;
      btn.addEventListener('click', ()=>{
        requireCode({ expectIndex: idx, title:`${name}'s code`, onSuccess:()=>{
          const cur = state.rsvp[ev.id][idx];
          const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
          state.rsvp[ev.id][idx] = next;
          persist(); renderEvents(); renderSummary();
        }});
      });
      row.appendChild(btn);
    });

    const ta = card.querySelector('textarea');
    ta.addEventListener('focus', e=>{
      if(unlockedIndices.size===0){ e.target.blur(); requireCode({ title:'Enter your code to edit notes', onSuccess:()=>ta.focus() }); }
    });
    ta.addEventListener('change', ()=>{
      requireCode({ title:'Enter your code', onSuccess:()=>{
        state.notes[ev.id] = ta.value; persist();
      }});
    });
  });
}

function renderAll(){ renderCrew(); renderSummary(); renderEvents(); updateLockBadge(); }

document.getElementById('addPerson').addEventListener('click', ()=>{
  requireCode({ title:'Enter your code to add someone', onSuccess:()=>{
    state.crew.push(`Person ${state.crew.length+1}`);
    EVENTS.forEach(ev=> state.rsvp[ev.id].push('none'));
    persist(); renderAll();
  }});
});

(async function init(){ await loadState(); renderAll(); })();
</script>
</body>
</html>
