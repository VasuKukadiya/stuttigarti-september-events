<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stuttgart Sept</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --ink:#141414; --wine:#7A2E2E; --gold:#F2B705; --gold-dim:#C98D02;
    --amber:#D9A441; --cream:#F6EFDD; --paper:#FBF6EA; --line:rgba(20,20,20,0.14);
    --go:#3E8E5B; --no:#B24638;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink);
    background-image:radial-gradient(circle at 15% 0%, rgba(122,46,46,0.5), transparent 45%),
                      radial-gradient(circle at 90% 100%, rgba(242,183,5,0.12), transparent 50%);
    font-family:'Work Sans', sans-serif; color:var(--cream);
    min-height:100vh; padding-bottom:40px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:600px; margin:0 auto; padding:16px 12px 8px;}
  .hidden{display:none !important;}

  /* ---- Login screen ---- */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; z-index:1;
  }
  .login-card{
    background:var(--paper); color:var(--ink); border-radius:18px; padding:28px 24px;
    max-width:340px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.4); text-align:center;
    position:relative; z-index:2;
  }
  .login-card h1{font-family:'Fraunces',serif; font-weight:700; font-size:24px; margin:0 0 4px; color:var(--ink);}
  .login-card h1 em{font-style:italic; color:var(--gold);}
  .login-card p{font-size:12.5px; color:#6b6155; margin:0 0 18px;}
  .bw-strip{font-size:12px; letter-spacing:.04em; color:var(--gold-dim); font-weight:600; margin-bottom:10px;}
  .tagline{font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:14px; color:var(--wine); margin:0 0 4px !important;}
  .login-field{text-align:left; margin-bottom:12px;}
  .login-field label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#6b6155; display:block; margin-bottom:5px;}
  .login-field select, .login-field input{
    width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line);
    font-family:inherit; font-size:16px; background:var(--cream); color:var(--ink); appearance:none;
  }
  .login-field select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%230F2733' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .login-btn{
    width:100%; border:none; padding:13px; border-radius:9px; font-weight:700; font-size:15px;
    background:var(--gold); color:#fff; margin-top:4px; cursor:pointer;
  }
  .login-error{color:var(--no); font-size:12px; margin-top:8px; display:none;}
  .login-loading{font-size:12.5px; color:#6b6155;}

  /* ---- Main app (unchanged) ---- */
  header{padding:4px 4px 14px; display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:24px; margin:0; color:var(--paper);}
  h1 em{font-style:italic; color:var(--gold);}
  .count{font-size:12px; color:rgba(244,239,227,0.55); display:flex; align-items:center; gap:10px;}
  .switch-user{background:none; border:none; color:rgba(244,239,227,0.55); font-size:11px; text-decoration:underline; cursor:pointer; padding:0;}

  .crew{background:var(--paper); color:var(--ink); border-radius:14px; padding:12px 12px 14px; box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .crew-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .crew-chip{display:flex; align-items:center; gap:4px; background:var(--cream); border:1px solid var(--line); border-radius:999px; padding:4px 4px 4px 10px; font-size:13px; font-weight:600;}
  .crew-chip input{border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); width:64px; outline:none;}
  .crew-chip button{border:none; background:var(--gold); color:#fff; width:18px; height:18px; border-radius:50%; font-size:11px; line-height:1;}
  .add-person{border:1.5px dashed var(--wine); background:transparent; color:var(--wine); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; margin-top:8px;}
  .lock-badge{display:inline-block; font-size:11px; margin-top:8px; padding:4px 10px; border-radius:999px; background:rgba(62,142,91,0.15); color:var(--go); border:1px solid rgba(62,142,91,0.35);}

  .table-card{margin-top:14px; background:var(--paper); color:var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .table-scroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  thead th{text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:#6b6155; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .ev-name{font-weight:700; font-size:12.5px;}
  .ev-link{color:var(--wine); font-size:11px; text-decoration:none;}
  .going-count{font-weight:700; color:var(--gold-dim); white-space:nowrap;}

  .events{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .event{background:var(--paper); color:var(--ink); border-radius:14px; padding:14px 14px 12px; box-shadow:0 6px 20px rgba(0,0,0,0.25); border-left:4px solid var(--gold);}
  .event.flag{border-left-color:var(--amber);}
  .ev-title{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 6px; line-height:1.15;}
  .meta{font-size:13px; line-height:1.6;}
  .meta a{color:var(--wine); text-decoration:none; font-weight:600;}
  .flag-note{margin-top:8px; font-size:11.5px; background:rgba(217,164,65,0.18); border:1px solid rgba(217,164,65,0.5); padding:6px 9px; border-radius:8px; color:#6b4d10;}

  .rsvp-row{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
  .rsvp-btn{display:flex; align-items:center; gap:5px; border:none; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:600; background:#e6e0d2; color:#5c5346; cursor:pointer;}
  .rsvp-btn .sym{width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; background:#c9c2b0; color:#fff;}
  .rsvp-btn.yes .sym{background:var(--go);}
  .rsvp-btn.maybe .sym{background:var(--amber);}
  .rsvp-btn.no .sym{background:var(--no);}
  .rsvp-btn.locked{opacity:0.5;}

  .notes-field{margin-top:10px;}
  .notes-field textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-family:inherit; font-size:12.5px; resize:vertical; min-height:32px; background:var(--cream); color:var(--ink);}
  .notes-field textarea::placeholder{color:#a89a83;}
  .notes-field textarea:disabled{opacity:0.6;}

  .ev-head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .edit-toggle{border:1px solid var(--line); background:var(--cream); color:var(--wine); font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;}

  .event-edit-form{display:flex; flex-direction:column; gap:8px; margin-top:4px; background:var(--cream); border-radius:10px; padding:10px;}
  .event-edit-form label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#6b6155; display:flex; flex-direction:column; gap:4px;}
  .event-edit-form input{padding:8px 9px; border-radius:7px; border:1px solid var(--line); font-family:inherit; font-size:13px; background:var(--paper); color:var(--ink);}
  .save-edit{margin-top:4px; border:none; background:var(--gold); color:#fff; font-weight:700; font-size:13px; padding:9px; border-radius:8px;}

  .comments{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .comment-list{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .comment{font-size:12.5px; line-height:1.4; background:var(--cream); border-radius:8px; padding:6px 9px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .comment-body{flex:1;}
  .comment-name{font-weight:700; margin-right:5px;}
  .comment-empty{font-size:11.5px; color:#a89a83; font-style:italic;}
  .comment-delete{border:none; background:none; color:#B24638; font-size:15px; line-height:1; padding:0 2px; flex-shrink:0; cursor:pointer;}
  .comment-input-row{display:flex; gap:6px;}
  .comment-input{flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:13px; background:var(--cream); color:var(--ink);}
  .comment-input:disabled{opacity:0.6;}
  .comment-post{border:none; background:var(--wine); color:#fff; font-weight:600; font-size:12px; padding:0 14px; border-radius:8px;}
  .comment-post:disabled{opacity:0.5;}

  .save-state{position:fixed; bottom:10px; right:10px; font-size:10px; color:rgba(244,239,227,0.55); background:rgba(0,0,0,0.35); padding:4px 9px; border-radius:999px;}

  .meme-grid{
    position: fixed; inset: 0; z-index: 0;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px;
  }
  .meme-grid img{ width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>

<!-- ===== Login screen ===== -->
<div id="loginScreen">
  <div class="meme-grid">
    <img src="preview.jpg">
    <img src="preview (1).jpg">
    <img src="preview (2).jpg">
    <img src="preview (3).jpg">
    <img src="preview (4).jpg">
  </div>
  <div class="login-card">
    <h1>Stuttgart <em>Sept</em></h1>
    <div class="bw-strip">🥨 · 🍇 · 🏰 Baden-Württemberg · THE LÄND</div>
    <p class="tagline">Nett hier. Aber waren Sie schon mal eingeloggt?</p>
    <p id="loginSub">Amtlich nett. Bitte kurz warten…</p>
    <div id="loginForm" class="hidden">
      <div class="login-field">
        <label>Who are you?</label>
        <select id="loginName"></select>
      </div>
      <div class="login-field">
        <label>Your code</label>
        <input type="password" id="loginPass" placeholder="Enter your passcode" autocomplete="off" inputmode="text">
      </div>
      <button class="login-btn" id="loginBtn">Rein da 🥨</button>
      <div class="login-error" id="loginError">Wrong code — try again.</div>
    </div>
  </div>
</div>

<!-- ===== Main app ===== -->
<div class="wrap hidden" id="mainApp">
  <header>
    <h1>Stuttgart <em>Sept</em></h1>
    <span class="count">🍇 BW · 5 events <button class="switch-user" id="switchUser">switch user</button></span>
  </header>

  <div class="crew">
    <div class="crew-grid" id="crewGrid"></div>
    <button class="add-person" id="addPerson">+ Freund einschmuggeln</button>
    <div><span class="lock-badge" id="lockBadge"></span></div>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead><tr><th>Event</th><th>Dates</th><th>Transit</th><th>Going</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <div class="events" id="eventsWrap"></div>
</div>
<div class="save-state hidden" id="saveState">·</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
function mapsLink(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }

const EVENTS = [
  {
    id:'stuttgart-am-meer', name:'Stuttgart am Meer',
    dates:'Thu 3.9, 10:00–22:00',
    address:'Konrad-Adenauer-Str. 2, 70173 Stuttgart',
    transit:'U-Bahn Charlottenplatz (U1/U2/U4/U5/U6/U7/U9/U12/U14/U15) · 2 min walk',
    price:'Free', flag:null
  },
  {
    id:'eat-spain-drink-spain', name:'Eat Spain Drink Spain',
    dates:'5.9 – 20.9 (all month)',
    address:'Various venues, Stuttgart',
    transit:'Varies by venue — check each listing',
    price:'Pay as you go', flag:null
  },
  {
    id:'lubu-moves', name:'LuBu MoVes (dance)',
    dates:'Wed 9.9, 19:00–20:00',
    address:'Arsenalplatz, 71638 Ludwigsburg',
    transit:'Bus stop "Ludwigsburg Arsenalplatz" (422/425/426/431/444) · right there. Ludwigsburg Bahnhof (S4/S5) · 6 min walk',
    price:'Free', flag:'This one is in Ludwigsburg, not Stuttgart — about 25 min by S-Bahn from the city centre.'
  },
  {
    id:'fantasy-filmfest', name:'40. Fantasy Filmfest',
    dates:'9.9 18:00 – 16.9 23:45',
    address:'Königstraße 20, 70173 Stuttgart (Gloria 2)',
    transit:'U-Bahn Schlossplatz · 1 min walk',
    price:'€12–14', flag:null
  },
  {
    id:'street-food-festival', name:'Street Food Festival – Feuersee',
    dates:'App: 18.9–20.9 · Poster: 25–27.9',
    address:'Feuerseeplatz, 70176 Stuttgart',
    transit:'U-Bahn/S-Bahn Feuersee · 3 min walk',
    price:'Free', flag:'Date conflict: the flyer and the saved listing disagree — confirm before you plan around it.'
  }
];

const DEFAULT_NAMES = ['Vasu','William','Raf','Mira','Hamza'];

// ---- SETUP before publishing ----
// One code per crew member, same order as DEFAULT_NAMES.
const PERSON_CODES = ["14112000","152486","652389","456825","584625"];
const firebaseConfig = {
  apiKey: "AIzaSyBnYC1W2kV4-TNGL01gU8Xb-aPH4ta8nKI",
  authDomain: "stuttgartevents-26d45.firebaseapp.com",
  projectId: "stuttgartevents-26d45",
  storageBucket: "stuttgartevents-26d45.firebasestorage.app",
  messagingSenderId: "616809840102",
  appId: "1:616809840102:web:df85ed3b938355efebea27"
};
// ----------------------------------

let dbAvailable = true;
let db, stateDocRef;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  stateDocRef = db.collection('plannerApp').doc('state');
}catch(e){
  dbAvailable = false;
  console.warn('Firebase not configured yet — running in local-only mode.', e);
}

let state = { crew: DEFAULT_NAMES.slice(), rsvp:{}, notes:{}, comments:{}, eventsOverride:{} };
let unlockedIndices = new Set(JSON.parse(sessionStorage.getItem('unlocked_indices') || '[]'));
let currentUserIndex = sessionStorage.getItem('current_user_index');
currentUserIndex = currentUserIndex === null ? null : parseInt(currentUserIndex, 10);
let suppressNextSnapshot = false;
const STATUS_ORDER = ['none','yes','maybe','no'];
const STATUS_SYM = { none:'–', yes:'✓', maybe:'?', no:'✕' };
const ADMIN_NAME = 'Vasu';

function isAdmin(){
  return currentUserIndex !== null && state.crew[currentUserIndex] === ADMIN_NAME;
}
function getEventData(ev){
  return Object.assign({}, ev, state.eventsOverride[ev.id] || {});
}
function saveCurrentUser(){
  if(currentUserIndex === null) sessionStorage.removeItem('current_user_index');
  else sessionStorage.setItem('current_user_index', String(currentUserIndex));
}

function saveUnlocked(){ sessionStorage.setItem('unlocked_indices', JSON.stringify([...unlockedIndices])); }
function saveIndicator(t){ document.getElementById('saveState').textContent = t; }

function normalizeState(){
  EVENTS.forEach(ev=>{
    const existing = state.rsvp[ev.id] || [];
    if(existing.length !== state.crew.length){
      state.rsvp[ev.id] = state.crew.map((_,i)=> existing[i] || 'none');
    }
    if(state.notes[ev.id] === undefined) state.notes[ev.id] = '';
    if(!Array.isArray(state.comments[ev.id])) state.comments[ev.id] = [];
  });
  if(!state.eventsOverride) state.eventsOverride = {};
}

async function loadState(){
  if(!dbAvailable){ normalizeState(); return; }
  try{
    const snap = await stateDocRef.get();
    if(snap.exists){
      const d = snap.data();
      state.crew = (d.crew && d.crew.length) ? d.crew : DEFAULT_NAMES.slice();
      state.rsvp = d.rsvp || {};
      state.notes = d.notes || {};
      state.comments = d.comments || {};
      state.eventsOverride = d.eventsOverride || {};
    }
  }catch(e){
    console.warn('Firestore read failed — check your rules and config.', e);
  }
  normalizeState();
  stateDocRef.onSnapshot(snap=>{
    if(suppressNextSnapshot){ suppressNextSnapshot=false; return; }
    if(!snap.exists) return;
    const d = snap.data();
    state.crew = (d.crew && d.crew.length) ? d.crew : state.crew;
    state.rsvp = d.rsvp || state.rsvp;
    state.notes = d.notes || state.notes;
    state.comments = d.comments || state.comments;
    state.eventsOverride = d.eventsOverride || state.eventsOverride;
    normalizeState();
    if(document.getElementById('mainApp').classList.contains('hidden')){
      populateLoginDropdown();
    }else{
      renderAll();
    }
  }, err=>{
    console.warn('Firestore live sync failed — check your rules.', err);
  });
}

async function persist(){
  if(!dbAvailable){ saveIndicator('local only — add Firebase config to sync'); return; }
  saveIndicator('saving…');
  suppressNextSnapshot = true;
  try{
    await stateDocRef.set({
      crew:state.crew, rsvp:state.rsvp, notes:state.notes,
      comments:state.comments, eventsOverride:state.eventsOverride
    });
    saveIndicator('saved');
  }catch(e){
    saveIndicator('save FAILED — check rules');
    console.error('Firestore write failed:', e);
  }
}

/* ================= LOGIN SCREEN ================= */
function populateLoginDropdown(){
  const sel = document.getElementById('loginName');
  sel.innerHTML = '';
  state.crew.forEach((name, idx)=>{
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  document.getElementById('loginSub').textContent = 'Pick your name and enter your code.';
  if(!dbAvailable){
    document.getElementById('loginSub').textContent = 'Pick your name and enter your code. (Firebase not set up yet — changes won\'t sync between friends until you add your config.)';
  }
  document.getElementById('loginForm').classList.remove('hidden');
}

function attemptLogin(){
  const idx = parseInt(document.getElementById('loginName').value, 10);
  const val = document.getElementById('loginPass').value.trim();
  const error = document.getElementById('loginError');
  if(val && val === PERSON_CODES[idx]){
    unlockedIndices.add(idx);
    saveUnlocked();
    currentUserIndex = idx;
    saveCurrentUser();
    showApp();
  }else{
    error.style.display = 'block';
  }
}

function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('saveState').classList.remove('hidden');
  renderAll();
}

function showLogin(){
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('saveState').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').style.display = 'none';
  populateLoginDropdown();
}

document.getElementById('loginBtn').addEventListener('click', attemptLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key === 'Enter') attemptLogin(); });
document.getElementById('switchUser').addEventListener('click', ()=>{
  unlockedIndices.clear();
  saveUnlocked();
  currentUserIndex = null;
  saveCurrentUser();
  showLogin();
});

/* ================= MAIN APP (RSVP etc) ================= */
function updateLockBadge(){
  const b = document.getElementById('lockBadge');
  const names = [...unlockedIndices].map(i=> state.crew[i]||`P${i+1}`).join(', ');
  b.textContent = '🔓 Signed in as: ' + names + (isAdmin() ? ' (admin)' : '');
}

// small inline prompt kept only for "shared" actions (crew/notes) when someone
// else's session tries to edit without ever logging in — shouldn't normally trigger
// since the login screen already required a valid code.
function requireCode({ expectIndex=null, onSuccess }){
  const already = expectIndex !== null ? unlockedIndices.has(expectIndex) : unlockedIndices.size > 0;
  if(already) onSuccess();
}

function renderCrew(){
  const grid = document.getElementById('crewGrid');
  grid.innerHTML = '';
  state.crew.forEach((name, idx)=>{
    const chip = document.createElement('div');
    chip.className = 'crew-chip';
    const input = document.createElement('input');
    input.value = name;
    input.disabled = unlockedIndices.size === 0;
    input.addEventListener('change', ()=>{
      requireCode({ onSuccess:()=>{
        state.crew[idx] = input.value.trim() || `Person ${idx+1}`;
        persist(); renderSummary(); renderEvents();
      }});
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.addEventListener('click', ()=>{
      requireCode({ onSuccess:()=>{
        if(state.crew.length<=1) return;
        state.crew.splice(idx,1);
        EVENTS.forEach(ev=> state.rsvp[ev.id].splice(idx,1));
        unlockedIndices = new Set([...unlockedIndices].map(i=> i>idx? i-1 : i).filter(i=> i!==idx));
        saveUnlocked();
        persist(); renderAll();
      }});
    });
    chip.appendChild(input); chip.appendChild(del);
    grid.appendChild(chip);
  });
}

function renderSummary(){
  const body = document.getElementById('summaryBody');
  body.innerHTML = '';
  EVENTS.forEach(ev0=>{
    const ev = getEventData(ev0);
    const going = state.rsvp[ev0.id].filter(s=>s==='yes').length;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><div class="ev-name">${ev.name}</div><a class="ev-link" href="${mapsLink(ev.address)}" target="_blank" rel="noopener">📍 map</a></td>
      <td>${ev.dates}</td>
      <td>${ev.transit.split('·')[0]}</td>
      <td class="going-count">${going}/${state.crew.length}</td>
    `;
    body.appendChild(tr);
  });
}

let editingEventId = null;

function renderEvents(){
  const wrap = document.getElementById('eventsWrap');
  wrap.innerHTML = '';
  EVENTS.forEach(ev0=>{
    const ev = getEventData(ev0);
    const card = document.createElement('div');
    card.className = 'event' + (ev.flag ? ' flag' : '');

    const editing = isAdmin() && editingEventId === ev0.id;

    card.innerHTML = `
      <div class="ev-head-row">
        <h3 class="ev-title">${ev.name}</h3>
        ${isAdmin() ? `<button class="edit-toggle" data-ev="${ev0.id}">${editing ? 'Cancel' : '✏️ Edit'}</button>` : ''}
      </div>
      ${editing ? renderEditForm(ev) : `
        <div class="meta">
          🗓 ${ev.dates}<br>
          📍 <a href="${mapsLink(ev.address)}" target="_blank" rel="noopener">${ev.address}</a><br>
          🚉 ${ev.transit}<br>
          € ${ev.price}
        </div>
        ${ev.flag ? `<div class="flag-note">⚠ ${ev.flag}</div>` : ''}
      `}
      <div class="rsvp-row" data-ev="${ev0.id}"></div>
      <div class="comments" data-ev="${ev0.id}">
        <div class="comment-list"></div>
        <div class="comment-input-row">
          <input type="text" class="comment-input" placeholder="${currentUserIndex===null ? 'Log in to comment' : 'Add a comment…'}" ${currentUserIndex===null?'disabled':''}>
          <button class="comment-post" ${currentUserIndex===null?'disabled':''}>Post</button>
        </div>
      </div>
    `;
    wrap.appendChild(card);

    if(editing){
      const form = card.querySelector('.event-edit-form');
      form.querySelector('.save-edit').addEventListener('click', ()=>{
        const get = sel => form.querySelector(sel).value.trim();
        state.eventsOverride[ev0.id] = {
          name: get('[data-f="name"]') || ev0.name,
          dates: get('[data-f="dates"]') || ev0.dates,
          address: get('[data-f="address"]') || ev0.address,
          transit: get('[data-f="transit"]') || ev0.transit,
          price: get('[data-f="price"]') || ev0.price,
          flag: get('[data-f="flag"]') || null
        };
        editingEventId = null;
        persist();
        renderAll();
      });
    } else if(isAdmin()){
      card.querySelector('.edit-toggle').addEventListener('click', ()=>{
        editingEventId = editingEventId === ev0.id ? null : ev0.id;
        renderEvents();
      });
    }

    const row = card.querySelector('.rsvp-row');
    state.crew.forEach((name, idx)=>{
      const status = state.rsvp[ev0.id][idx];
      const canEdit = unlockedIndices.has(idx);
      const btn = document.createElement('button');
      btn.className = 'rsvp-btn ' + status + (canEdit ? '' : ' locked');
      btn.title = canEdit ? '' : `Only ${name} can change this`;
      btn.innerHTML = `<span class="sym">${STATUS_SYM[status]}</span>${name}`;
      btn.addEventListener('click', ()=>{
        if(!canEdit) return;
        const cur = state.rsvp[ev0.id][idx];
        const next = STATUS_ORDER[(STATUS_ORDER.indexOf(cur)+1) % STATUS_ORDER.length];
        state.rsvp[ev0.id][idx] = next;
        persist(); renderEvents(); renderSummary();
      });
      row.appendChild(btn);
    });

    renderComments(card, ev0.id);
    const input = card.querySelector('.comment-input');
    const postBtn = card.querySelector('.comment-post');
    const submit = ()=>{
      const text = input.value.trim();
      if(!text || currentUserIndex===null) return;
      state.comments[ev0.id].push({ name: state.crew[currentUserIndex], text, ts: Date.now() });
      input.value = '';
      persist();
      renderComments(card, ev0.id);
    };
    postBtn.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  });
}

function renderEditForm(ev){
  return `
    <div class="event-edit-form">
      <label>Name<input type="text" data-f="name" value="${ev.name.replace(/"/g,'&quot;')}"></label>
      <label>Dates<input type="text" data-f="dates" value="${ev.dates.replace(/"/g,'&quot;')}"></label>
      <label>Address<input type="text" data-f="address" value="${ev.address.replace(/"/g,'&quot;')}"></label>
      <label>Transit<input type="text" data-f="transit" value="${ev.transit.replace(/"/g,'&quot;')}"></label>
      <label>Price<input type="text" data-f="price" value="${ev.price.replace(/"/g,'&quot;')}"></label>
      <label>Flag / warning (optional)<input type="text" data-f="flag" value="${(ev.flag||'').replace(/"/g,'&quot;')}"></label>
      <button class="save-edit">Save changes</button>
    </div>
  `;
}

function renderComments(card, eventId){
  const list = card.querySelector('.comment-list');
  const comments = state.comments[eventId] || [];
  if(comments.length === 0){
    list.innerHTML = `<div class="comment-empty">Noch nix. Sehr schwäbisch: erstmal abwarten.</div>`;
    return;
  }
  list.innerHTML = '';
  comments.forEach((c, i)=>{
    const canDelete = currentUserIndex !== null && c.name === state.crew[currentUserIndex];
    const row = document.createElement('div');
    row.className = 'comment';
    row.innerHTML = `
      <span class="comment-body"><span class="comment-name">${c.name}</span><span class="comment-text"></span></span>
      ${canDelete ? `<button class="comment-delete" title="Delete comment">×</button>` : ''}
    `;
    row.querySelector('.comment-text').textContent = c.text;
    if(canDelete){
      row.querySelector('.comment-delete').addEventListener('click', ()=>{
        state.comments[eventId].splice(i, 1);
        persist();
        renderComments(card, eventId);
      });
    }
    list.appendChild(row);
  });
}

function renderAll(){ renderCrew(); renderSummary(); renderEvents(); updateLockBadge(); }

document.getElementById('addPerson').addEventListener('click', ()=>{
  requireCode({ onSuccess:()=>{
    state.crew.push(`Person ${state.crew.length+1}`);
    EVENTS.forEach(ev=> state.rsvp[ev.id].push('none'));
    persist(); renderAll();
  }});
});

(async function init(){
  normalizeState();
  populateLoginDropdown();   // show the login screen instantly with names baked into the file
  await loadState();         // fetch/refresh in the background — updates dropdown or app if needed
  if(unlockedIndices.size > 0){
    showApp();
  }
})();
</script>
</body>
</html>
